[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qi"
version = "0.1.0"
description = "Quality Intelligence — scaffold AI-assisted QA projects in seconds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-tmp-path",
]

[project.scripts]
qi = "qi.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qi*"]

[tool.setuptools.package-data]
qi = ["templates/**/*"]
